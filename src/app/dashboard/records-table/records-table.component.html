<div class="table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">{{element.name}}</td>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element">{{element.description}}</td>
    </ng-container>

    <!-- Short URL Column -->
    <ng-container matColumnDef="shortUrl">
      <th mat-header-cell *matHeaderCellDef>Short URL</th>
      <td mat-cell *matCellDef="let element">{{element.shortUrl}}</td>
    </ng-container>

    <!-- QR Code Column -->
    <ng-container matColumnDef="qrCode">
      <th mat-header-cell *matHeaderCellDef>QR Code</th>
      <td mat-cell *matCellDef="let element"><img [src]="element.qrImg || 'assets/qrcode.svg'" alt="QR Code" style="width: 50px; height: 50px;"></td>
    </ng-container>

    <!-- Created Column -->
    <ng-container matColumnDef="created">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let element">{{element.created | date:'dd/MM/yyyy HH:mm:ss'}}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-button color="primary">View</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
